{{define "layout.html"}}
<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            {{if .PageTitle}}
            {{.PageTitle}} - Kukicha
            {{else}}
            Kukicha
            {{end}}
        </title>
        <link rel="icon" type="image/svg+xml" href="{{.InstanceIdenticonURL}}">
        <link rel="stylesheet" href="{{.UnpolyStylesheetURL}}">
        <link rel="stylesheet" href="{{.StylesheetURL}}">
        <script src="{{.UnpolyJavaScriptURL}}" defer></script>
        <script src="{{.PlayerJavaScriptURL}}" defer></script>
    </head>

    <body class="app">
        <svg class="icon-sprite" aria-hidden="true">
            <symbol id="icon-play" viewBox="0 0 24 24">
                <path fill="currentColor" d="M8 5v14l11-7z"></path>
            </symbol>

            <symbol id="icon-pause" viewBox="0 0 24 24">
                <path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
            </symbol>

            <symbol id="icon-previous" viewBox="0 0 24 24">
                <path fill="currentColor" d="M6 6h3v12H6zm3.5 6 8.5 6V6z"></path>
            </symbol>

            <symbol id="icon-next" viewBox="0 0 24 24">
                <path fill="currentColor" d="m6 18 8.5-6L6 6zm9-12v12h3V6z"></path>
            </symbol>

            <symbol id="icon-volume" viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z">
                </path>
            </symbol>

            <symbol id="icon-volume-off" viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M3 9v6h4l5 5V4L7 9H3zm13.59 3L14 14.59 15.41 16 18 13.41 20.59 16 22 14.59 19.41 12 22 9.41 20.59 8 18 10.59 15.41 8 14 9.41z">
                </path>
            </symbol>

            <symbol id="icon-playlist" viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18A3 3 0 1 0 19 17V8h3V6h-5z">
                </path>
            </symbol>

            <symbol id="icon-track-actions" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="2" fill="currentColor"></circle>
                <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
                <circle cx="12" cy="19" r="2" fill="currentColor"></circle>
            </symbol>
        </svg>

        <header class="top-nav">
            <nav aria-label="Primary navigation" up-nav>
                <a href="{{.HomeURL}}" up-follow>home</a>
                <a href="{{.LibraryURL}}" up-alias="{{.LibraryURL}}/*" up-follow>library</a>
                <a href="{{.SearchURL}}" up-follow>search</a>
            </nav>

            <div class="avatar">
                <img src="{{.InstanceIdenticonURL}}" alt="Kukicha instance identicon">
            </div>
        </header>

        <main class="content-outer-shell" up-main>
            <section class="content-inner-shell">
                {{block "page-content" .}}{{end}}
            </section>
        </main>

        <footer id="player" class="now-playing" up-keep>
            <audio data-player-audio preload="metadata"></audio>

            <section class="album-meta" role="status" aria-live="polite" aria-atomic="true">
                <div class="artwork-shell">
                    <img data-player-artwork alt="" hidden>
                </div>

                <div>
                    <div class="album-title" data-player-album></div>
                    <div class="album-artists" data-player-album-artists hidden></div>
                </div>
            </section>

            <section class="primary-controls" aria-label="Playback controls">
                <button class="play-button" type="button" data-player-action="toggle" aria-label="Play" disabled>
                    <svg class="audio-icon" aria-hidden="true">
                        <use href="#icon-play" data-player-play-icon></use>
                    </svg>
                </button>

                <div class="track-info">
                    <div class="track-info-text">
                        <div class="track-title" data-player-title>Choose a track</div>

                        <div class="track-time">
                            <span data-player-current-time>0:00</span>
                            <span aria-hidden="true"> / </span>
                            <span class="visually-hidden">of</span>
                            <span data-player-duration>0:00</span>
                        </div>
                    </div>

                    <input class="track-bar range-control" type="range" min="0" max="0" value="0" step="0.1"
                        data-player-seek aria-label="Seek through track" disabled>
                </div>

                <div class="track-buttons">
                    <button class="icon-button" type="button" data-player-action="previous" aria-label="Previous track"
                        disabled>
                        <svg class="audio-icon" aria-hidden="true">
                            <use href="#icon-previous"></use>
                        </svg>
                    </button>

                    <button class="icon-button" type="button" data-player-action="next" aria-label="Next track"
                        disabled>
                        <svg class="audio-icon" aria-hidden="true">
                            <use href="#icon-next"></use>
                        </svg>
                    </button>
                </div>
            </section>

            <section class="secondary-controls" aria-label="Player options">
                <button class="icon-button" type="button" aria-label="Playlist">
                    <svg class="audio-icon" aria-hidden="true">
                        <use href="#icon-playlist"></use>
                    </svg>
                </button>

                <button class="icon-button" type="button" data-player-action="mute" aria-label="Mute">
                    <svg class="audio-icon" aria-hidden="true">
                        <use href="#icon-volume" data-player-volume-icon></use>
                    </svg>
                </button>

                <input class="volume-bar range-control" type="range" min="0" max="1" value="1" step="0.01"
                    data-player-volume aria-label="Volume">
            </section>
        </footer>
    </body>

</html>
{{end}}
