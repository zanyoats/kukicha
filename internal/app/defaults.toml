[logging]
# Minimum severity written to the log: debug, info, warn, or error.
level = "info"

[scan]
# Manage music roots in the app under Settings > Roots.

# Literal delimiters in priority order; empty strings are invalid.
# Split at the earliest match, breaking ties by array order.
# Parts are trimmed using Go's Unicode whitespace set; empty parts are discarded.
primary_genre_split_tokens = [";", "|"]
secondary_genre_split_tokens = [",", "/"]

# Ignore local filenames or remote object keys during file scanning or syncing (new tracks).
# For local roots, file emptiness is determined while ignoring matching prefixes or files
# for top-level entries. Set either list to [] to disable its exclusions.
ignore_prefixes = ["."]
ignore_files = ["__MACOSX", "desktop.ini", "thumbs.db", "$recycle.bin", "system volume information"]

# Set to "0s" to disable periodic scan progress messages.
progress_log_interval = "5s"

# Maximum size for sidecar, embedded, and downloaded artwork (iTunes and metadata overrides).
# Oversized artwork is skipped.
# Size = 25 × 1024 × 1024 = 26,214,400 bytes
local_artwork_max_bytes = 26_214_400

[scan.itunes]
# Disables new lookups, but allows existing cached artwork.
enabled = true
# How long to be able to read the http headers before timing out
request_timeout = "20s"
# Space network lookups out to reduce bursts
lookup_interval = "1s"
# Maximum attempts per request, including the first attempt.
max_attempts = 2

[scan.discogs]
enabled = true
request_timeout = "20s"
lookup_interval = "1s"
max_attempts = 2

[scan.musicbrainz]
enabled = true
request_timeout = "20s"
lookup_interval = "1s"
max_attempts = 2

[scan.recognized_sidecar_artwork]
"cover"    = true
"folder"   = true
"front"    = true
"album"    = true
"artwork"  = true
"albumart" = true

[scan.genre_style_aliases]
"altrock"      = "alternative rock"
"alt rock"     = "alternative rock"
"alternative"  = "alternative rock"
"dance&dj"     = "dance-pop"
"dance & dj"   = "dance-pop"
"dance and dj" = "dance-pop"
"dance"        = "dance-pop"
"electronique" = "electronic"
"électronique" = "electronic"

[upload]
# Maximum total HTTP upload request size, including multipart headers.
# 2 GiB = 2 × 1024 × 1024 × 1024 bytes. Does not limit server folder/bucket imports.
max_request_bytes = 2_147_483_648

[server]
# Directory where kukicha.db will be stored.
# This directory must already exist.
# database_path = "..."

# HTTP server listening address in format "host:port".
# Host can also be empty for all available interfaces ":4533".
server_address = "127.0.0.1:4533"

# URL path where the kukicha web app is mounted.
# Must not be empty or the root path ("/").
app_base_path = "/kukicha"

# Maximum time to read an HTTP request's headers.
# Closes connections if the client takes too long to send request headers.
# Note: This does not limit how long audio streaming can run.
read_header_timeout = "5s"

# Maximum time an idle HTTP keep-alive connection waits for the next request.
# Does not limit active audio streams, uploads, or server-sent event responses.
# When using a reverse proxy, set this higher than the proxy's upstream idle
# keep-alive timeout (the timeout for its connections to Kukicha).
# Set to "0s" to disable the idle timeout. Must not be negative.
idle_timeout = "3m"

# Maximum time to wait for active HTTP requests during shutdown.
# After this timeout, remaining connections are forcibly closed.
# Increase if HTTP shutdown logs "context deadline exceeded"
# and you want to give active requests more time to finish.
shutdown_timeout = "5s"

# Lifetime of new login sessions. Uses Go durations (for example "24h").
# 4320h is 180 days. Must be at least 1s; existing tokens keep their expiry.
session_lifetime = "4320h"

[server.database]
busy_timeout = "5s"

cache_size_kib = 32_768

[jobs]
# Positive integer, or "auto"
# Controls jobs that use a worker pool to potentially speed up tasks.
# "auto" is most likely a good default.
workers = "auto"

# How often to check for queued jobs. Don't make this too small: your CPU needs
# its naps and to allow other work to be done.
poll_interval = "250ms"

# Maximum time to save a job's final state, even after cancellation.
finalize_timeout = "5s"

[ui]
# Number of items per page in the album library and sync logs.
per_page = 200

# Default library order: recentlyAdded, recentlyPlayed, album, or artistAlbum.
default_album_sort = "recentlyAdded"

# Minimum toast display time. Longer messages receive 60ms per character.
# The timer pauses while hovered, focused, or the browser tab is hidden.
toast_min_duration = "5s"

[radio]
# Minimum tracks required to play an artist, genre, or style radio.
# Must be at least 1. Applied after restart; no scan or sync is needed.
min_tracks = 10
