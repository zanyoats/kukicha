[logging]
# Minimum severity written to the log: debug, info, warn, or error.
level = "info"

[scan]
# Root IDs must be non-empty and unique across local and remote roots.
# IDs are case-sensitive and identify logical collections independently of storage.
# Changing an ID creates a new logical root and new track IDs.
# Entries are validated and scanned in array order, regardless of type.
#
# Below is a single local root:
#
# [[scan.roots]]
# type = "local"
# id = "itunes-lib"
# path = "~/Music"
#
# ...and a remote, S3-compatible root:
#
# Credentials use the AWS credential chain; profile selects a named AWS profile.
# Prefixes are exact object-key prefixes; use a trailing slash for a folder tree.
# Prefixes must not overlap for the same endpoint and bucket.
# [[scan.roots]]
# type = "remote"                         # Required
# id = "music-archive"                    # Required
# endpoint_url = "https://s3.example.com" # Required
# bucket = "music"                        # Required
# prefix = "library/"                     # Optional
# profile = "music"                       # Optional
# region = "us-east-1"                    # Required, unless provided by AWS configuration.
# addressing_style = "auto"               # Available options:
                                          # | ---------|-------------------------------------|-------------------------------|
                                          # | path     | Bucket goes in the URL path.        | https://s3.example.com/music/ |
                                          # | ---------|-------------------------------------|-------------------------------|
                                          # | virtual  | Bucket goes in the hostname.        | https://music.s3.example.com/ |
                                          # | ---------|-------------------------------------|-------------------------------|
                                          # | auto     | SDK chooses based on the endpoint   | Either form                   |
                                          # |          | and bucket name, preferring virtual |                               |
                                          # |          | hosting when suitable.              |                               |
                                          # | ---------|-------------------------------------|-------------------------------|
roots = []

# Set to "0s" to disable periodic scan progress messages.
progress_log_interval = "5s"

# Oversized sidecar and embedded artwork is ignored.
# Size = 25 × 1024 × 1024 = 26,214,400 bytes
local_artwork_max_bytes = 26_214_400

[scan.itunes]
# Disables new iTunes lookups, but allows existing cached artwork.
# To also disable existing cache lookups clear the itunes cache too.
enabled = true

request_timeout = "20s"

# Space itunes network lookups out to reduce bursts;
# HTTP 429 responses can extend the delay.
lookup_interval = "1s"

retry_attempts = 2

[scan.album_artist_split_tokens]
"with" = true
"and"  = true
"&"    = true
","    = true
";"    = true
"/"    = true
"-"    = true
"="    = true

[scan.recognized_sidecar_artwork]
"cover"    = true
"folder"   = true
"front"    = true
"album"    = true
"artwork"  = true
"albumart" = true

[scan.primary_genre_split_tokens]
";" = true
"|" = true

[scan.secondary_genre_split_tokens]
"," = true
"/" = true

[scan.genre_style_aliases]
"altrock"      = "alternative rock"
"alt rock"     = "alternative rock"
"alternative"  = "alternative rock"
"dance&dj"     = "dance-pop"
"dance & dj"   = "dance-pop"
"dance and dj" = "dance-pop"
"dance"        = "dance-pop"
"electronique" = "electronic"
"électronique" = "electronic"

[server]
# Directory where kukicha.db will be stored.
# This directory must already exist.
# database_path = "..."

# HTTP server listening address in format "host:port".
# Host can also be empty for all available interfaces ":4533".
server_address = "127.0.0.1:4533"

# URL path where the kukicha web app is mounted.
# Must not be empty or the root path ("/").
app_base_path = "/kukicha"

# Maximum time to read an HTTP request's headers.
# Closes connections if the client takes too long to send request headers.
# Note: This does not limit how long audio streaming can run.
read_header_timeout = "5s"

# Maximum time to wait for active HTTP requests during shutdown.
# After this timeout, remaining connections are forcibly closed.
# Increase if HTTP shutdown logs "context deadline exceeded"
# and you want to give active requests more time to finish.
shutdown_timeout = "5s"

# Lifetime of new login sessions. Uses Go durations (for example "24h").
# 4320h is 180 days. Must be at least 1s; existing tokens keep their expiry.
session_lifetime = "4320h"

[server.database]
busy_timeout = "5s"

cache_size_kib = 32_768

[jobs]
# Positive integer, or "auto"
# Controls jobs that use a worker pool to potentially speed up tasks.
# "auto" is most likely a good default.
workers = "auto"

# How often to check for queued jobs. Don't make this too small: your CPU needs
# its naps and to allow other work to be done.
poll_interval = "250ms"

# Maximum time to save a job's final state, even after cancellation.
finalize_timeout = "5s"

[ui]
# Number of items per page in the album library and sync logs.
per_page = 200

# Default library order: recentlyAdded, album, or artistAlbum.
default_album_sort = "recentlyAdded"

# Minimum toast display time. Longer messages receive 60ms per character.
# The timer pauses while hovered, focused, or the browser tab is hidden.
toast_min_duration = "8s"
