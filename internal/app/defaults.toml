[scan]
# Music roots must already exist.
roots = []

# Disables new iTunes lookups, but allows existing cached artwork.
# To also disable existing cache lookups clear the itunes cache too.
itunes_lookup = true

[scan.album_artist_split_tokens]
"with" = true
"and"  = true
"&"    = true
","    = true
";"    = true
"/"    = true
"-"    = true
"="    = true

[scan.album_artist_split_auto_tokens]
"&" = true
"/" = true

[scan.recognized_sidecar_artwork]
"cover"    = true
"folder"   = true
"front"    = true
"album"    = true
"artwork"  = true
"albumart" = true

[scan.primary_genre_split_tokens]
";" = true
"|" = true

[scan.secondary_genre_split_tokens]
"," = true
"/" = true

[scan.genre_style_aliases]
"altrock"      = "alternative rock"
"alt rock"     = "alternative rock"
"alternative"  = "alternative rock"
"dance&dj"     = "dance-pop"
"dance & dj"   = "dance-pop"
"dance and dj" = "dance-pop"
"dance"        = "dance-pop"
"electronique" = "electronic"
"électronique" = "electronic"

[server]
# Directory where kukicha.db will be stored.
# This directory must already exist.
# database_path = "..."

# HTTP server listening address in format "host:port".
# Host can also be empty for all available interfaces ":4533".
server_address = "127.0.0.1:4533"

# URL path where the kukicha web app is mounted.
# Must not be empty or the root path ("/").
app_base_path = "/kukicha/app"

[ui]
per_page = 200
